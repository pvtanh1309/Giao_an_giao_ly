version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /Frontend
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /Backend
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infrastructure/environments/dev
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infrastructure/environments/prod
    schedule:
      interval: weekly

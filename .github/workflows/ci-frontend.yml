name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]
    

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          DIFF_MODE: ${{ github.event_name == 'pull_request' && 'three-dot' || 'two-dot' }}
        run: python3 scripts/ci/detect_changes.py

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0

      - name: Set up pnpm
        run: npm install --global pnpm@12.3.4

      - name: Get pnpm store path
        id: pnpm-store
        working-directory: Frontend
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('Frontend/pnpm-lock.yaml') }}

      - name: Install Frontend dependencies
        working-directory: Frontend
        run: pnpm install --frozen-lockfile

      - name: Run Frontend tests
        working-directory: Frontend
        run: pnpm test

      - name: Type check Frontend
        working-directory: Frontend
        run: pnpm exec tsc --noEmit

      - name: Build Frontend with placeholder public config
        working-directory: Frontend
        env:
          NEXT_PUBLIC_AWS_REGION: ap-southeast-1
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ap-southeast-1_example
          NEXT_PUBLIC_COGNITO_CLIENT_ID: example-client-id
          NEXT_PUBLIC_CONTENT_API_URL: https://content-api.example.com
          NEXT_PUBLIC_USERS_API_URL: https://users-api.example.com
        run: pnpm build

  required:
    name: frontend-required
    needs: [changes, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check filter and CI results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CI_RESULT: ${{ needs.frontend.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.relevant }}
        run: python3 scripts/ci/check_required_jobs.py

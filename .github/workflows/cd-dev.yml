name: CD-DEV Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, prod]
      backend_run_id:
        description: Successful Backend CI push run on main containing Lambda artifacts
        required: true
        type: string
      operation:
        description: Review a plan first; deploy creates and applies a fresh plan
        required: true
        default: plan
        type: choice
        options: [plan, deploy]

permissions:
  contents: read
  actions: read

concurrency:
  group: cd-aws-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deployed.outputs.frontend_url }}
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_ENV: ${{ inputs.environment }}
      BACKEND_RUN_ID: ${{ inputs.backend_run_id }}
      AWS_REGION: ap-southeast-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      # Change this through a reviewed commit when upgrading Terraform.
      TERRAFORM_VERSION: '1.15.0'
      TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugin-cache

    steps:
      - name: Check out workflow source for validation script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Backend CI run
        id: release
        env:
            BACKEND_RUN_ID: ${{ inputs.backend_run_id }}
            GH_REPO: ${{ github.repository }}
            GH_TOKEN: ${{ github.token }}

        run: |
            set -euo pipefail

            [[ "$BACKEND_RUN_ID" =~ ^[0-9]+$ ]]

            gh api \
            "repos/$GH_REPO/actions/runs/$BACKEND_RUN_ID" \
            > "$RUNNER_TEMP/backend-run.json"

            python3 scripts/cd/validate_backend_run.py

      - name: Check out exact release source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Download Lambda artifacts from selected CI run
        uses: actions/download-artifact@v6
        with:
          name: lambda-release-${{ steps.release.outputs.sha }}
          path: Backend/dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.backend_run_id }}

      - name: Verify manifest and ZIP checksums
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          dist = Path('Backend/dist')
          manifest = json.loads((dist / 'release-manifest.json').read_text())
          if manifest.get('schemaVersion') != 1 or manifest.get('sourceSha') != os.environ['RELEASE_SHA']:
              raise SystemExit('Manifest source/schema mismatch')
          expected = {'lessons-api.zip', 'catalog-api.zip', 'users-api.zip'}
          if set(manifest.get('artifacts', {})) != expected:
              raise SystemExit('Manifest artifact set mismatch')
          for name in sorted(expected):
              actual = hashlib.sha256((dist / name).read_bytes()).hexdigest()
              if actual != manifest['artifacts'][name]['sha256']:
                  raise SystemExit(f'Checksum mismatch: {name}')
          PY

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Prepare Terraform provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-terraform-${{ env.TERRAFORM_VERSION }}-${{ hashFiles('infrastructure/environments/*/.terraform.lock.hcl') }}

      - name: Show OIDC identity for trust policy diagnosis
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          print('Target role:', os.environ['DEPLOY_ROLE_ARN'])
          print('Target environment:', os.environ['TARGET_ENV'])
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          # Display only identity claims; never print the JWT or request token.
          print(json.dumps({key: claims.get(key) for key in ('iss', 'aud', 'sub')}, indent=2))
          PY

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: github-cd-${{ github.run_id }}

      - name: Write environment configuration
        env:
          TFVARS_JSON: ${{ secrets.TFVARS_JSON }}
        run: |
          set -euo pipefail
          test -n "$TFVARS_JSON"
          printf '%s' "$TFVARS_JSON" > "infrastructure/environments/$TARGET_ENV/cd.auto.tfvars.json"

      - name: Initialize and validate Terraform
        run: |
          set -euo pipefail
          terraform -chdir="infrastructure/environments/$TARGET_ENV" init -input=false -lockfile=readonly
          terraform -chdir="infrastructure/environments/$TARGET_ENV" validate

      - name: Create deployment plan
        run: |
          set -euo pipefail
          terraform -chdir="infrastructure/environments/$TARGET_ENV" plan -input=false -lock-timeout=5m -out=cd.tfplan
          terraform -chdir="infrastructure/environments/$TARGET_ENV" show -no-color cd.tfplan

      - name: Apply saved plan
        if: inputs.operation == 'deploy'
        run: terraform -chdir="infrastructure/environments/$TARGET_ENV" apply -input=false cd.tfplan

      - name: Read deployed outputs
        id: deployed
        if: inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          terraform -chdir="infrastructure/environments/$TARGET_ENV" output -json > "$RUNNER_TEMP/tf-outputs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          values = json.loads((Path(os.environ['RUNNER_TEMP']) / 'tf-outputs.json').read_text())
          names = {
              'NEXT_PUBLIC_COGNITO_USER_POOL_ID': 'user_pool_id',
              'NEXT_PUBLIC_COGNITO_CLIENT_ID': 'app_client_id',
              'NEXT_PUBLIC_CONTENT_API_URL': 'content_api_endpoint',
              'NEXT_PUBLIC_USERS_API_URL': 'users_api_endpoint',
              'APP_BUCKET': 'app_bucket_name',
              'DISTRIBUTION_ID': 'cloudfront_distribution_id',
              'FRONTEND_URL': 'frontend_url',
              'CLOUDFRONT_DOMAIN': 'cloudfront_domain_name',
          }
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('NEXT_PUBLIC_AWS_REGION=ap-southeast-1\n')
              for name, key in names.items():
                  value = values[key]['value']
                  if not isinstance(value, str) or not value or '\n' in value or '\r' in value:
                      raise SystemExit(f'Invalid Terraform output: {key}')
                  output.write(f'{name}={value}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"frontend_url={values['frontend_url']['value']}\n")
          PY

      - name: Set up Node.js
        if: inputs.operation == 'deploy'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, matching CI
        with:
          node-version: 22.13.0

      - name: Set up pnpm
        if: inputs.operation == 'deploy'
        run: npm install --global pnpm@12.3.4

      - name: Get pnpm store path
        if: inputs.operation == 'deploy'
        id: pnpm-store
        working-directory: Frontend
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: inputs.operation == 'deploy'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('Frontend/pnpm-lock.yaml') }}

      - name: Fingerprint frontend public configuration
        if: inputs.operation == 'deploy'
        id: frontend-config
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          config = {key: value for key, value in os.environ.items() if key.startswith('NEXT_PUBLIC_')}
          digest = hashlib.sha256(json.dumps(config, sort_keys=True).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"hash={digest}\n")
          PY

      - name: Cache Next build data
        if: inputs.operation == 'deploy'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: Frontend/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-cd-${{ inputs.environment }}-node22-${{ steps.frontend-config.outputs.hash }}-${{ hashFiles('Frontend/pnpm-lock.yaml', 'Frontend/next.config.mjs') }}-${{ steps.release.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-next-cd-${{ inputs.environment }}-node22-${{ steps.frontend-config.outputs.hash }}-${{ hashFiles('Frontend/pnpm-lock.yaml', 'Frontend/next.config.mjs') }}-

      - name: Test and build frontend with deployed public configuration
        if: inputs.operation == 'deploy'
        working-directory: Frontend
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm test
          pnpm exec tsc --noEmit
          pnpm build
          test -f out/index.html

      - name: Upload frontend and invalidate CloudFront
        if: inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          # Keep old hashed assets for clients with an older cached HTML page.
          # Scope all uploads to frontend/: the same bucket also stores private lesson media.
          aws s3 sync Frontend/out/ "s3://$APP_BUCKET/frontend/" --exclude '*' --include '_next/static/*' --cache-control 'public,max-age=31536000,immutable'
          aws s3 sync Frontend/out/ "s3://$APP_BUCKET/frontend/" --exclude '_next/static/*' --cache-control 'no-cache'
          aws cloudfront wait distribution-deployed --id "$DISTRIBUTION_ID"
          invalidation=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$invalidation"

      - name: Smoke test public boundary
        if: inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 --max-time 30 "$FRONTEND_URL/" -o /dev/null
          for api in "$NEXT_PUBLIC_CONTENT_API_URL/lessons" "$NEXT_PUBLIC_USERS_API_URL/catechists"; do
            status=$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' "$api")
            test "$status" = '401'
          done

      - name: Summarize release
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          OPERATION: ${{ inputs.operation }}
        run: |
          {
            printf '### CD %s: %s\n' "$TARGET_ENV" "$OPERATION"
            printf 'Source: `%s`\n\nBackend CI run: `%s`\n' "$RELEASE_SHA" "$BACKEND_RUN_ID"
            if [ "$OPERATION" = 'deploy' ]; then
              printf '\nWebsite: [%s](%s)\n' "$FRONTEND_URL" "$FRONTEND_URL"
              printf '\nCloudFront: [https://%s](https://%s)\n' "$CLOUDFRONT_DOMAIN" "$CLOUDFRONT_DOMAIN"
              printf '\nCloudFront deployment, cache invalidation and smoke tests completed successfully.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: Backend CI

on:
  pull_request:
    branches: [main]
    paths: ["Backend/**", ".github/workflows/ci-backend.yml"]
  push:
    branches: [main]
  merge_group:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      # CD checks out the whole app at this artifact's SHA, including Frontend.
      # Every main push therefore needs its own tested release artifacts.
      relevant: ${{ github.event_name == 'push' || steps.filter.outputs.backend == 'true' }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          DIFF_MODE: ${{ github.event_name == 'pull_request' && 'three-dot' || 'two-dot' }}
        run: python3 scripts/ci/detect_changes.py

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7 
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements-dev.txt

      - name: Install Backend test dependencies
        run: python -m pip install -r Backend/requirements-dev.txt

      - name: Run Backend tests
        working-directory: Backend
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: ap-southeast-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python -m pytest -q

      - name: Package Lambda functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python Backend/scripts/package_lambdas.py

      - name: Create release manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/ci/create_release_manifest.py

      - name: Upload trusted main Lambda artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: lambda-release-${{ github.sha }}
          path: |
            Backend/dist/content-api.zip
            Backend/dist/users-api.zip
            Backend/dist/release-manifest.json
          if-no-files-found: error
          retention-days: 30

  required:
    name: backend-required
    needs: [changes, backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7 # v7.0.1

      - name: Check filter and CI results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CI_RESULT: ${{ needs.backend.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.relevant }}
        run: python3 scripts/ci/check_required_jobs.py

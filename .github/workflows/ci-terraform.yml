name: Terraform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@v7 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          DIFF_MODE: ${{ github.event_name == 'pull_request' && 'three-dot' || 'two-dot' }}
        run: python3 scripts/ci/detect_changes.py

  terraform:
    name: terraform
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7 # v5.6.0
        with:
          python-version: '3.12'

      - name: Package Lambda functions for validation
        run: python Backend/scripts/package_lambdas.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4  
        with:
          terraform_version: 1.15.0
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -recursive infrastructure

      - name: Validate Dev Terraform configuration
        working-directory: infrastructure/environments/dev
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

      - name: Validate Prod Terraform configuration
        working-directory: infrastructure/environments/prod
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

  required:
    name: terraform-required
    needs: [changes, terraform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7 # v7.0.1

      - name: Check filter and CI results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CI_RESULT: ${{ needs.terraform.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.relevant }}
        run: python3 scripts/ci/check_required_jobs.py
